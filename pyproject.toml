[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkforge"
version = "0.1.0"
description = "Link prediction and knowledge discovery on knowledge graphs (TransE, DistMult, ComplEx, HolE) in PyTorch"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "pandas>=2.0"]
keywords = ["knowledge graph", "link prediction", "embeddings", "graph machine learning"]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["matplotlib>=3.7"]

[project.scripts]
linkforge = "linkforge.cli:main"

[tool.setuptools]
packages = ["linkforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
